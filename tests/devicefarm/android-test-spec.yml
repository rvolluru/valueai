version: 0.1
android_test_host: amazon_linux_2
phases:
  install:
    commands:
      - devicefarm-cli use node 22
      - devicefarm-cli use appium 3
      - devicefarm-cli use python 3.11
      - cd "$DEVICEFARM_TEST_PACKAGE_PATH"
      - python -m pip install -r requirements.txt
  pre_test:
    commands:
      - |-
        appium --base-path=/wd/hub --log-level warn --log-no-colors \
          --default-capabilities "{\"platformName\":\"Android\",\"appium:automationName\":\"UiAutomator2\",\"appium:udid\":\"$DEVICEFARM_DEVICE_UDID\",\"appium:app\":\"$DEVICEFARM_APP_PATH\"}" \
          > "$DEVICEFARM_LOG_DIR/appium.log" 2>&1 &
      - |-
        for attempt in $(seq 1 60); do
          if curl --silent --fail http://127.0.0.1:4723/wd/hub/status > /dev/null; then
            break
          fi
          sleep 1
        done
        curl --silent --fail http://127.0.0.1:4723/wd/hub/status > /dev/null
  test:
    commands:
      - cd "$DEVICEFARM_TEST_PACKAGE_PATH"
      - python run_remote.py
artifacts:
  - $DEVICEFARM_LOG_DIR
