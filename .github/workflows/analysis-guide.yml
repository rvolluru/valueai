name: Verify analysis guide

on:
  push:
    paths:
      - '**/*.md'
      - docs/*.html
      - scripts/build*guide.py
      - scripts/build_docs_site.py
      - .github/workflows/analysis-guide.yml
  pull_request:
    paths:
      - '**/*.md'
      - docs/*.html
      - scripts/build*guide.py
      - scripts/build_docs_site.py
      - .github/workflows/analysis-guide.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python scripts/build_analysis_guide.py --check
      - run: python scripts/build_docs_site.py --check
