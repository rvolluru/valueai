name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      full_terraform:
        description: "Run full Terraform apply (required for infra changes)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: valueai-mvp-api
      TF_DIR: infra/terraform
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image (with Clerk build arg)
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: prod-${{ github.run_number }}-${{ github.sha }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "${VITE_CLERK_PUBLISHABLE_KEY}"
          case "${VITE_CLERK_PUBLISHABLE_KEY}" in
            pk_*) ;;
            *) echo "VITE_CLERK_PUBLISHABLE_KEY is missing/invalid (must start with pk_)" >&2; exit 1 ;;
          esac
          echo "clerk_key_present=yes"
          echo "clerk_key_len=${#VITE_CLERK_PUBLISHABLE_KEY}"
          echo "clerk_key_prefix=${VITE_CLERK_PUBLISHABLE_KEY:0:3}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -f apps/api/Dockerfile \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY="${VITE_CLERK_PUBLISHABLE_KEY}" \
            -t "${IMAGE_URI}" \
            --push \
            .
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Write production tfvars from secret
        env:
          TFVARS_PROD_B64: ${{ secrets.TFVARS_PROD_B64 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          SHIPPO_API_KEY: ${{ secrets.SHIPPO_API_KEY }}
          SHIPPO_DEFAULT_CONTACT_EMAIL: ${{ secrets.SHIPPO_DEFAULT_CONTACT_EMAIL }}
          SHIPPO_DEFAULT_CONTACT_PHONE: ${{ secrets.SHIPPO_DEFAULT_CONTACT_PHONE }}
        run: |
          set -euo pipefail
          test -n "${TFVARS_PROD_B64}"
          mkdir -p "${TF_DIR}"
          echo "${TFVARS_PROD_B64}" | base64 --decode > "${TF_DIR}/terraform.tfvars"
          # CI uses aws-actions credentials, not local AWS profiles.
          # Force local-only vars to null to avoid provider profile lookup errors.
          if grep -qE '^[[:space:]]*aws_profile[[:space:]]*=' "${TF_DIR}/terraform.tfvars"; then
            sed -i.bak -E 's#^[[:space:]]*aws_profile[[:space:]]*=.*#aws_profile                       = null#' "${TF_DIR}/terraform.tfvars"
          else
            echo 'aws_profile                       = null' >> "${TF_DIR}/terraform.tfvars"
          fi
          if grep -qE '^[[:space:]]*aws_assume_role_arn[[:space:]]*=' "${TF_DIR}/terraform.tfvars"; then
            sed -i.bak -E 's#^[[:space:]]*aws_assume_role_arn[[:space:]]*=.*#aws_assume_role_arn               = null#' "${TF_DIR}/terraform.tfvars"
          fi
          if [ -n "${STRIPE_SECRET_KEY:-}" ]; then
            if grep -qE '^[[:space:]]*stripe_secret_key[[:space:]]*=' "${TF_DIR}/terraform.tfvars"; then
              sed -i.bak -E "s#^[[:space:]]*stripe_secret_key[[:space:]]*=.*#stripe_secret_key                  = \"${STRIPE_SECRET_KEY}\"#" "${TF_DIR}/terraform.tfvars"
            else
              echo "stripe_secret_key                  = \"${STRIPE_SECRET_KEY}\"" >> "${TF_DIR}/terraform.tfvars"
            fi
          fi
          if [ -n "${STRIPE_PUBLISHABLE_KEY:-}" ]; then
            if grep -qE '^[[:space:]]*stripe_publishable_key[[:space:]]*=' "${TF_DIR}/terraform.tfvars"; then
              sed -i.bak -E "s#^[[:space:]]*stripe_publishable_key[[:space:]]*=.*#stripe_publishable_key             = \"${STRIPE_PUBLISHABLE_KEY}\"#" "${TF_DIR}/terraform.tfvars"
            else
              echo "stripe_publishable_key             = \"${STRIPE_PUBLISHABLE_KEY}\"" >> "${TF_DIR}/terraform.tfvars"
            fi
          fi
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            if grep -qE '^[[:space:]]*openai_api_key[[:space:]]*=' "${TF_DIR}/terraform.tfvars"; then
              sed -i.bak -E "s#^[[:space:]]*openai_api_key[[:space:]]*=.*#openai_api_key                    = \"${OPENAI_API_KEY}\"#" "${TF_DIR}/terraform.tfvars"
            else
              echo "openai_api_key                    = \"${OPENAI_API_KEY}\"" >> "${TF_DIR}/terraform.tfvars"
            fi
          fi
          if [ -n "${SHIPPO_API_KEY:-}" ]; then
            if grep -qE '^[[:space:]]*shippo_api_key[[:space:]]*=' "${TF_DIR}/terraform.tfvars"; then
              sed -i.bak -E "s#^[[:space:]]*shippo_api_key[[:space:]]*=.*#shippo_api_key                   = \"${SHIPPO_API_KEY}\"#" "${TF_DIR}/terraform.tfvars"
            else
              echo "shippo_api_key                   = \"${SHIPPO_API_KEY}\"" >> "${TF_DIR}/terraform.tfvars"
            fi
          fi
          if [ -n "${SHIPPO_DEFAULT_CONTACT_EMAIL:-}" ]; then
            if grep -qE '^[[:space:]]*shippo_default_contact_email[[:space:]]*=' "${TF_DIR}/terraform.tfvars"; then
              sed -i.bak -E "s#^[[:space:]]*shippo_default_contact_email[[:space:]]*=.*#shippo_default_contact_email         = \"${SHIPPO_DEFAULT_CONTACT_EMAIL}\"#" "${TF_DIR}/terraform.tfvars"
            else
              echo "shippo_default_contact_email         = \"${SHIPPO_DEFAULT_CONTACT_EMAIL}\"" >> "${TF_DIR}/terraform.tfvars"
            fi
          fi
          if [ -n "${SHIPPO_DEFAULT_CONTACT_PHONE:-}" ]; then
            if grep -qE '^[[:space:]]*shippo_default_contact_phone[[:space:]]*=' "${TF_DIR}/terraform.tfvars"; then
              sed -i.bak -E "s#^[[:space:]]*shippo_default_contact_phone[[:space:]]*=.*#shippo_default_contact_phone         = \"${SHIPPO_DEFAULT_CONTACT_PHONE}\"#" "${TF_DIR}/terraform.tfvars"
            else
              echo "shippo_default_contact_phone         = \"${SHIPPO_DEFAULT_CONTACT_PHONE}\"" >> "${TF_DIR}/terraform.tfvars"
            fi
          fi

      - name: Decide deploy mode (fast ECS vs full Terraform)
        id: mode
        run: |
          set -euo pipefail
          infra_changed=false
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD | grep -q '^infra/terraform/'; then
              infra_changed=true
            fi
          fi
          if [[ "${{ github.event.inputs.full_terraform || 'false' }}" == "true" || "${infra_changed}" == "true" ]]; then
            echo "use_terraform=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_terraform=false" >> "$GITHUB_OUTPUT"
          fi
          project_name=$(grep -E '^[[:space:]]*project_name[[:space:]]*=' "${TF_DIR}/terraform.tfvars" | head -1 | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')
          if [ -z "${project_name}" ]; then
            project_name="valueai-mvp"
          fi
          echo "project_name=${project_name}" >> "$GITHUB_OUTPUT"
          echo "infra_changed=${infra_changed}" >> "$GITHUB_OUTPUT"

      - name: Fast deploy API image via ECS (skip Terraform)
        if: steps.mode.outputs.use_terraform == 'false'
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          PROJECT_NAME: ${{ steps.mode.outputs.project_name }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          SHIPPO_API_KEY: ${{ secrets.SHIPPO_API_KEY }}
          SHIPPO_DEFAULT_CONTACT_EMAIL: ${{ secrets.SHIPPO_DEFAULT_CONTACT_EMAIL }}
          SHIPPO_DEFAULT_CONTACT_PHONE: ${{ secrets.SHIPPO_DEFAULT_CONTACT_PHONE }}
        run: |
          set -euo pipefail
          CLUSTER="${PROJECT_NAME}-cluster"
          SERVICE="${PROJECT_NAME}-api"
          CURRENT_TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --query 'services[0].taskDefinition' \
            --output text)
          aws ecs describe-task-definition --task-definition "${CURRENT_TASK_DEF_ARN}" > /tmp/current-td.json
          jq --arg IMAGE "${IMAGE_URI}" \
             --arg OPENAI_API_KEY "${OPENAI_API_KEY:-}" \
             --arg STRIPE_SECRET_KEY "${STRIPE_SECRET_KEY:-}" \
             --arg STRIPE_PUBLISHABLE_KEY "${STRIPE_PUBLISHABLE_KEY:-}" \
             --arg SHIPPO_API_KEY "${SHIPPO_API_KEY:-}" \
             --arg SHIPPO_DEFAULT_CONTACT_EMAIL "${SHIPPO_DEFAULT_CONTACT_EMAIL:-}" \
             --arg SHIPPO_DEFAULT_CONTACT_PHONE "${SHIPPO_DEFAULT_CONTACT_PHONE:-}" '
            def upsert_env($n; $v):
              if ($v|length) == 0 then .
              elif ((.environment // []) | map(.name) | index($n)) != null
              then .environment = ((.environment // []) | map(if .name == $n then .value = $v else . end))
              else .environment = ((.environment // []) + [{name: $n, value: $v}])
              end;
            .taskDefinition
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
            | .containerDefinitions |= map(
                if .name == "api"
                then
                  (.image = $IMAGE
                  | upsert_env("OPENAI_API_KEY"; $OPENAI_API_KEY)
                  | upsert_env("GPT_ITEM_PROFILE_PROVIDER_ORDER"; "hybrid,gemini,openai")
                  | upsert_env("GPT_ITEM_PROFILE_TIMEOUT_S"; "120")
                  | upsert_env("STRIPE_SECRET_KEY"; $STRIPE_SECRET_KEY)
                  | upsert_env("STRIPE_PUBLISHABLE_KEY"; $STRIPE_PUBLISHABLE_KEY)
                  | upsert_env("SHIPPO_API_KEY"; $SHIPPO_API_KEY)
                  | upsert_env("SHIPPO_DEFAULT_CONTACT_EMAIL"; $SHIPPO_DEFAULT_CONTACT_EMAIL)
                  | upsert_env("SHIPPO_DEFAULT_CONTACT_PHONE"; $SHIPPO_DEFAULT_CONTACT_PHONE))
                else . end
              )
          ' /tmp/current-td.json > /tmp/new-td.json
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/new-td.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --task-definition "${NEW_TASK_DEF_ARN}" \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "${CLUSTER}" --services "${SERVICE}"

          SUBNETS=$(aws ecs describe-services --cluster "${CLUSTER}" --services "${SERVICE}" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.subnets' --output text | tr '\t' ',')
          SECURITY_GROUPS=$(aws ecs describe-services --cluster "${CLUSTER}" --services "${SERVICE}" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.securityGroups' --output text | tr '\t' ',')
          ASSIGN_PUBLIC_IP=$(aws ecs describe-services --cluster "${CLUSTER}" --services "${SERVICE}" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.assignPublicIp' --output text)
          cat > /tmp/openai-smoke.py <<'PY'
          import json
          import os
          import sys

          import httpx

          key = os.getenv("OPENAI_API_KEY", "").strip()
          result = {"openai_key_configured": bool(key), "status_code": None, "error": None}
          exit_code = 1
          if not key:
              result["error"] = "OPENAI_API_KEY missing"
          else:
              try:
                  resp = httpx.post(
                      "https://api.openai.com/v1/responses",
                      headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
                      json={"model": "gpt-5-nano", "input": "Return only OK."},
                      timeout=60,
                  )
                  result["status_code"] = resp.status_code
                  if resp.status_code < 400:
                      exit_code = 0
                  else:
                      result["error"] = resp.text[:800]
              except Exception as exc:
                  result["error"] = str(exc)

          print("OPENAI_DEPLOY_SMOKE=" + json.dumps(result))
          error = str(result.get("error") or "")
          if "insufficient_quota" in error or "credit_balance_exhausted" in error:
              sys.exit(86)
          sys.exit(exit_code)
          PY
          jq -n --rawfile code /tmp/openai-smoke.py \
            '{containerOverrides:[{name:"api",command:["python","-c",$code]}]}' > /tmp/openai-smoke-overrides.json
          SMOKE_TASK_ARN=$(aws ecs run-task \
            --cluster "${CLUSTER}" \
            --task-definition "${NEW_TASK_DEF_ARN}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUPS}],assignPublicIp=${ASSIGN_PUBLIC_IP}}" \
            --overrides file:///tmp/openai-smoke-overrides.json \
            --query 'tasks[0].taskArn' \
            --output text)
          set +e
          aws ecs wait tasks-stopped --cluster "${CLUSTER}" --tasks "${SMOKE_TASK_ARN}"
          SMOKE_EXIT=$(aws ecs describe-tasks --cluster "${CLUSTER}" --tasks "${SMOKE_TASK_ARN}" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          set -e
          if [ "${SMOKE_EXIT}" != "0" ]; then
            echo "OpenAI post-deploy smoke test failed with exit code ${SMOKE_EXIT}; rolling back to ${CURRENT_TASK_DEF_ARN}" >&2
            aws ecs update-service \
              --cluster "${CLUSTER}" \
              --service "${SERVICE}" \
              --task-definition "${CURRENT_TASK_DEF_ARN}" \
              --force-new-deployment >/dev/null
            aws ecs wait services-stable --cluster "${CLUSTER}" --services "${SERVICE}"
            exit 1
          fi
          echo "Fast ECS deploy completed on ${SERVICE} with ${IMAGE_URI}"

      - name: Setup Terraform
        if: steps.mode.outputs.use_terraform == 'true'
        uses: hashicorp/setup-terraform@v4

      - name: Write terraform backend config from secret
        if: steps.mode.outputs.use_terraform == 'true'
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_BACKEND_CONFIG_B64: ${{ secrets.TF_BACKEND_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${TF_BACKEND_CONFIG_B64}"
          echo "${TF_BACKEND_CONFIG_B64}" | base64 --decode > backend.hcl

      - name: Terraform apply (new image)
        if: steps.mode.outputs.use_terraform == 'true'
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          terraform init -input=false -backend-config=backend.hcl
          terraform apply -auto-approve -input=false -var "container_image=${{ steps.image.outputs.image_uri }}"
